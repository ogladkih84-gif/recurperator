# Выбираем профиль классической Нано для сборки командной утилитой Ардуино.
default_profile: nano # Этот профиль используется без параметра выбора платы.
profiles: # Описываем доступные профили сборки.
  nano: # Настраиваем классическую Нано с современным загрузчиком.
    fqbn: arduino:avr:nano:cpu=atmega328 # Выбираем плату и процессор до компиляции скетча.
    platforms: # Фиксируем пакет поддержки плат.
      - platform: arduino:avr (1.8.6) # Используем стабильную версию официального ядра АВР.
  nano_old: # Даём отдельный профиль для старого загрузчика.
    fqbn: arduino:avr:nano:cpu=atmega328old # Меняем только способ загрузки на старую Нано.
    platforms: # Используем ту же версию ядра.
      - platform: arduino:avr (1.8.6) # Фиксируем совместимое официальное ядро.
